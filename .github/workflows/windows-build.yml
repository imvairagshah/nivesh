name: NiveshDesk Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Source zip extract (koi bhi naam)
        shell: pwsh
        run: |
          Write-Host "Repo me files:"
          Get-ChildItem -Recurse -File | Select-Object -ExpandProperty FullName
          $zip = Get-ChildItem -Path . -Filter *.zip -File -Recurse |
            Where-Object { $_.FullName -notmatch '\\extracted\\' } |
            Select-Object -First 1
          if (-not $zip) {
            throw "Repo me koi .zip nahi mila — NiveshDesk-source.zip upload karo (root me)."
          }
          Write-Host "Extracting: $($zip.FullName)"
          Expand-Archive -Path $zip.FullName -DestinationPath extracted -Force
          if (-not (Test-Path 'extracted/angel_trader')) {
            throw "Zip ke andar 'angel_trader' folder nahi mila — sahi zip upload karo."
          }
          Write-Host "OK — extracted/angel_trader ready"

      - name: Flutter SDK (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: extracted/angel_trader
        run: flutter pub get

      - name: Tests (non-blocking)
        continue-on-error: true
        working-directory: extracted/angel_trader
        run: flutter test

      - name: Windows .exe build
        working-directory: extracted/angel_trader
        run: flutter build windows --release

      - name: Artifact upload (download ke liye)
        uses: actions/upload-artifact@v4
        with:
          name: NiveshDesk-Windows
          path: extracted/angel_trader/build/windows/x64/runner/Release/
